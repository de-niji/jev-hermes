name: jev
version: 0.7.0
description: "TypeSafe Jev for Hermes: cheap typed decisions via OpenRouter (route requests, gate risky commands, relevance-based context compaction, triage mail without reading bodies into context)."
author: jev-hermes contributors
license: MIT
homepage: https://github.com/de-niji/jev-hermes
tags: [jev, typesafe, openrouter, routing, mail, cost]
requires_env:
  - OPENROUTER_API_KEY
provides_tools:
  - jev_decide
  - jev_mail_triage
provides_hooks:
  - pre_tool_call
